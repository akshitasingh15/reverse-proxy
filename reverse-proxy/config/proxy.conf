# Reverse proxy configuration (local run)

listen_port = 8080
threads = 8          # worker threads in the pool
max_queue = 1024     # pending connections before returning 503
timeout_sec = 5      # socket read/write timeout

# Token bucket per client IP: bursts up to `capacity`, then `refill_per_sec` sustained.
# Set capacity to 0 to disable rate limiting.
rate_limit_capacity = 20
rate_limit_refill_per_sec = 10

# Backends, load-balanced round-robin with failover
backend = 127.0.0.1:9001
backend = 127.0.0.1:9002
backend = 127.0.0.1:9003

# Access control (CIDR). Deny always wins. If any allow rule exists,
# everything else is denied by default.
allow = 127.0.0.0/8
allow = 10.0.0.0/8
allow = 172.16.0.0/12
allow = 192.168.0.0/16
deny = 10.0.0.66/32

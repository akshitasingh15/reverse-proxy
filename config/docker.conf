# Configuration used inside Docker Compose.
# Backends are addressed by service name; Docker's DNS resolves them.

listen_port = 8080
threads = 8
max_queue = 1024
timeout_sec = 5

rate_limit_capacity = 20
rate_limit_refill_per_sec = 10

backend = backend1:9001
backend = backend2:9001
backend = backend3:9001

# Private ranges only (requests from your host arrive via Docker's 172.x gateway)
allow = 127.0.0.0/8
allow = 10.0.0.0/8
allow = 172.16.0.0/12
allow = 192.168.0.0/16
